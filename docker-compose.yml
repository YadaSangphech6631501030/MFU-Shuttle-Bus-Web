services:
  mongo:
    image: mongo:7
    container_name: mfu-shuttle-web-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-shuttlebus_web_system}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend-node
      args:
        INSTALL_DETECTOR: ${INSTALL_DETECTOR:-true}
    image: mfu-shuttle-bus-backend:latest
    container_name: mfu-shuttle-web-backend
    restart: unless-stopped
    ports:
      - "5101:5101"
    environment:
      PORT: 5101
      MONGO_URI: mongodb://mongo:27017/
      DB_NAME: ${DB_NAME:-shuttlebus_web_system}
      SECRET_KEY: ${SECRET_KEY:-super_secret_key_123}
      CAMERA_URL: ${CAMERA_URL:-http://192.168.110.234:4747/video}
      SAVE_INTERVAL: ${SAVE_INTERVAL:-5}
      DETECTOR_ENABLED: ${INSTALL_DETECTOR:-true}
    volumes:
      - backend-runtime:/app/runtime
    depends_on:
      mongo:
        condition: service_healthy

  admin-web:
    build:
      context: ./admin-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5101}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    image: mfu-shuttle-bus-admin-web:latest
    container_name: mfu-shuttle-web-admin
    restart: unless-stopped
    ports:
      - "8180:80"
    depends_on:
      backend:
        condition: service_healthy

  user-web:
    build:
      context: ./frontend-vue
      args:
        VITE_API_BASE_URL: ${USER_WEB_API_BASE_URL:-http://localhost:5101}
    image: mfu-shuttle-bus-user-web:latest
    container_name: mfu-shuttle-web-user
    restart: unless-stopped
    ports:
      - "8181:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
  backend-runtime:
